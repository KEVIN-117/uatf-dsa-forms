name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Selecciona el entorno de GitHub basado en la rama
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/uatf-forms
          # Tag 'latest' solo para la rama main (producción)
          # Tag 'dev' para la rama develop (pruebas locales/desarrollo)
          # Tags para versiones (v1.0.0)
          # Tag con el SHA del commit
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}
            type=sha


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
            VITE_AUTH_PARSE=${{ secrets.VITE_AUTH_PARSE }}
            VITE_NODE_ENV=${{ secrets.VITE_NODE_ENV }}
            NODE_ENV=${{ secrets.VITE_NODE_ENV }}

      - name: Trigger Render Deploy (Production Only)
        if: github.ref == 'refs/heads/main' && (env.RENDER_HOOK_PROD != '' || env.RENDER_HOOK_GEN != '')
        env:
          RENDER_HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_URL_PRODUCTION }}
          RENDER_HOOK_GEN: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK_PROD" ]; then
            curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
                "serviceId": "${{ secrets.RENDER_SERVICE_ID_PROD }}",
                "imageUrl": "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/uatf-forms:latest",
                "clearCache": "false"
              }' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys
          else
            curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
                "serviceId": "${{ secrets.RENDER_SERVICE_ID_PROD }}",
                "imageUrl": "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/uatf-forms:latest",
                "clearCache": "false"
              }' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys
          fi

      - name: Trigger Render Deploy (Development Only)
        if: github.ref == 'refs/heads/develop' && (env.RENDER_HOOK_DEV != '' || env.RENDER_HOOK_GEN != '')
        env:
          RENDER_HOOK_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_URL_DEVELOP }}
          RENDER_HOOK_GEN: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK_DEV" ]; then
            curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
                "serviceId": "${{ secrets.RENDER_SERVICE_ID_DEV }}",
                "imageUrl": "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/uatf-forms:dev",
                "clearCache": "true"
              }' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_DEV }}/deploys
          else
            curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
                "serviceId": "${{ secrets.RENDER_SERVICE_ID_DEV }}",
                "imageUrl": "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/uatf-forms:dev",
                "clearCache": "true"
              }' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_DEV }}/deploys
          fi
